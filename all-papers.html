<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uploaded Grade 6 Papers | Kavi Past Papers</title><link rel="stylesheet" href="style.css"><style>
.library{max-width:1200px;margin:24px auto;padding:0 16px}.library-controls{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin:18px 0}.library-controls input,.library-controls select{padding:12px;border:1px solid #bbb;border-radius:8px}.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.paper-card{border:1px solid #ddd;border-radius:12px;padding:15px;background:var(--card-bg,#fff);box-shadow:0 2px 8px #0001}.paper-card h3{font-size:16px;margin:0 0 8px}.meta{font-size:13px;line-height:1.55;opacity:.8}.actions{display:flex;gap:8px;margin-top:12px}.actions a{padding:9px 12px;border-radius:7px;text-decoration:none}.open{background:#1565c0;color:#fff}.download{background:#28a745;color:#fff}.notice{padding:12px;border-radius:8px;background:#fff3cd;margin:12px 0}@media(max-width:800px){.library-controls{grid-template-columns:1fr}.paper-grid{grid-template-columns:1fr}}</style></head>
<body><header class="site-header"><a class="brand" href="index.html">Kavi Past Papers</a><nav><a href="grade6-11.html">Grade 6-11</a><a href="all-papers.html">Uploaded Papers</a></nav></header><main class="library"><h1>Grade 6 Uploaded Paper Library</h1><p class="notice">Papers with clear cover-page details are categorized. Items marked “Needs Review” are still available here without guessing their province, year, term, or subject.</p><div class="library-controls"><input id="q" placeholder="Search subject, province, zone, college or document number"><select id="source"><option value="">All categories</option></select><select id="year"><option value="">All years</option></select><select id="term"><option value="">All terms</option></select><select id="subject"><option value="">All subjects</option></select></div><p id="count"></p><div id="grid" class="paper-grid"></div></main><script src="uploaded-papers-data.js"></script><script>
const P=window.UPLOADED_PAPERS||[];const $=id=>document.getElementById(id);function opts(id,key){const a=[...new Set(P.map(x=>x[key]).filter(Boolean))].sort();$(id).innerHTML += a.map(x=>`<option>${x}</option>`).join('')}
function init(){['source','year','term','subject'].forEach(id=>opts(id,id));['q','source','year','term','subject'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render()}
function render(){const q=$('q').value.toLowerCase();const f=P.filter(x=>(!$('source').value||x.source===$('source').value)&&(!$('year').value||x.year===$('year').value)&&(!$('term').value||x.term===$('term').value)&&(!$('subject').value||x.subject===$('subject').value)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('count').textContent=`${f.length} papers`; $('grid').innerHTML=f.map(x=>`<article class="paper-card"><h3>${x.subject}</h3><div class="meta"><b>${x.source}</b><br>${x.institution}<br>${x.grade} - ${x.year} - ${x.term} - ${x.medium}<br>Uploaded file: Document ${x.id} - ${x.pages} pages</div><div class="actions"><a class="open" target="_blank" href="${x.url}">Open</a><a class="download" download href="${x.url}">Download</a></div></article>`).join('')||'<p>No matching papers.</p>'}
init();</script></body></html>
